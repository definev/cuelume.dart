name: cuelume
description: Curated interaction sounds for Flutter — synthesized live, no audio files.
version: 0.1.0
repository: https://github.com/definev/cuelume
homepage: https://github.com/definev/cuelume
issue_tracker: https://github.com/definev/cuelume/issues
topics:
  - audio
  - sound
  - ui-sounds
  - interaction-feedback
  - synthesis

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
